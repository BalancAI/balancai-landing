<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B6B4A"/>
      <stop offset="55%" stop-color="#0E8F5E"/>
      <stop offset="100%" stop-color="#0A5A3D"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D352" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00D352" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#BFFFE0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#BFFFE0" stop-opacity="0"/>
    </radialGradient>
    <filter id="blurLg" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
    <filter id="blurMd" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <pattern id="dots" width="46" height="46" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#FFFFFF" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="url(#base)"/>
  <rect width="1920" height="1080" fill="url(#dots)"/>

  <circle cx="260" cy="180" r="360" fill="url(#glowA)" filter="url(#blurLg)"/>
  <circle cx="1680" cy="860" r="420" fill="url(#glowA)" filter="url(#blurLg)"/>
  <circle cx="1500" cy="160" r="260" fill="url(#glowB)" filter="url(#blurLg)"/>

  <!-- Фінансовий тренд: висхідна лінія з м'яким світінням -->
  <g filter="url(#blurMd)" opacity="0.5">
    <polyline points="0,760 220,700 460,760 720,560 980,640 1240,420 1500,480 1760,260 1920,300"
              fill="none" stroke="#EAFFF3" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <polyline points="0,760 220,700 460,760 720,560 980,640 1240,420 1500,480 1760,260 1920,300"
            fill="none" stroke="#EAFFF3" stroke-opacity="0.9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <g fill="#EAFFF3">
    <circle cx="220" cy="700" r="6"/>
    <circle cx="720" cy="560" r="6"/>
    <circle cx="1240" cy="420" r="6"/>
    <circle cx="1760" cy="260" r="6"/>
  </g>
</svg>
